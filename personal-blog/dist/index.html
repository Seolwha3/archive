<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Seolwha의 개인 기록 아카이브입니다.">
  <title>Seolwha Archive</title>
  <style>
    :root { color-scheme: light; --ink: #080808; --muted: #aaa; --line: #111; --paper: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(100% - 48px, 940px); margin: 0 auto; }
    .masthead { padding: 94px 20px 34px; text-align: center; border-bottom: 2px solid var(--line); }
    h1 { margin: 0; font-size: clamp(36px, 6vw, 58px); font-weight: 600; letter-spacing: -.055em; line-height: 1.15; }
    .subtitle { margin: 16px 0 0; color: #aaa; font-size: 16px; letter-spacing: -.025em; }
    .columns { display: grid; grid-template-columns: 175px minmax(0, 1fr); gap: 34px; padding: 24px 8px 90px; }
    .section-title { display: flex; align-items: center; gap: 8px; margin: 0 0 20px; font-size: 17px; font-weight: 600; letter-spacing: -.03em; }
    .section-title::before { content: ""; width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid currentColor; }
    .categories { list-style: none; padding: 0; margin: 0; }
    .categories li { border-bottom: 1px solid #e7e7e7; }
    .categories a { display: block; padding: 10px 2px; color: #333; font-size: 14px; }
    .categories a:hover, .categories a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
    .recent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .post-card { aspect-ratio: 1; min-width: 0; overflow: hidden; border: 1px solid #e4e4e4; background: #f7f7f7; position: relative; }
    .post-card a { display: flex; width: 100%; height: 100%; flex-direction: column; justify-content: flex-end; position: relative; }
    .post-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .post-card.has-image a::after { content: ""; position: absolute; inset: 35% 0 0; background: linear-gradient(transparent, rgb(0 0 0 / 68%)); }
    .post-copy { position: relative; z-index: 1; padding: 12px; }
    .post-card.has-image .post-copy { color: white; }
    .post-title { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.45; }
    .post-date { display: block; margin-top: 7px; color: #777; font-size: 12px; }
    .post-card.has-image .post-date { color: rgb(255 255 255 / 78%); }
    .empty-card { align-items: center; justify-content: center !important; color: #aaa; font-size: 13px; }
    footer { padding: 22px 0 30px; border-top: 1px solid #e8e8e8; color: #888; font-size: 12px; }
    @media (max-width: 760px) {
      .wrap { width: min(100% - 36px, 940px); }
      .masthead { padding: 68px 12px 26px; }
      .columns { grid-template-columns: 1fr; gap: 34px; padding: 22px 4px 70px; }
      .section-title { font-size: 17px; margin-bottom: 16px; }
      .categories { display: flex; flex-wrap: wrap; gap: 9px; }
      .categories li { border: 1px solid #ddd; }
      .categories a { padding: 6px 10px; font-size: 13px; }
      .recent-grid { gap: 10px; }
      .post-copy { padding: 10px; }
      .post-title { font-size: 12px; }
      .post-date { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="masthead wrap">
    <h1>Archive</h1>
    <p class="subtitle">개인 기록용 아카이브 페이지</p>
  </header>
  <main class="columns wrap">
    <aside aria-labelledby="category-heading">
      <h2 class="section-title" id="category-heading">CATEGORY</h2>
      <ul class="categories">
        <li><a href="categories/daily.html">일상</a></li>
        <li><a href="categories/travel.html">여행</a></li>
        <li><a href="categories/notes.html">기록</a></li>
      </ul>
    </aside>
    <section aria-labelledby="recent-heading">
      <h2 class="section-title" id="recent-heading">최근 글</h2>
      <!-- 새 글을 추가할 때 카드 링크를 글 주소로, 이미지가 있다면 글의 첫 번째 사진 경로를 img src에 지정하세요. -->
      <div class="recent-grid">
        <article class="post-card"><a class="empty-card" href="#">첫 번째 글</a></article>
        <article class="post-card"><a class="empty-card" href="#">두 번째 글</a></article>
        <article class="post-card"><a class="empty-card" href="#">세 번째 글</a></article>
      </div>
    </section>
  </main>
  <footer><div class="wrap">© 2026 Seolwha Archive</div></footer>
</body>
</html>
